<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420">
  <rect width="720" height="420" rx="32" fill="#ffffff" stroke="#d8d3cf" stroke-width="4"/>
  <!-- HTML5 Logo -->
  <rect x="50" y="50" width="120" height="80" rx="10" fill="#e34f26"/>
  <text x="110" y="95" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="24" font-weight="bold">HTML5</text>
  <!-- CSS3 Logo -->
  <rect x="200" y="50" width="120" height="80" rx="10" fill="#1572b6"/>
  <text x="260" y="95" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="24" font-weight="bold">CSS3</text>
  <!-- JavaScript Logo -->
  <rect x="350" y="50" width="120" height="80" rx="10" fill="#f7df1e"/>
  <text x="410" y="95" text-anchor="middle" fill="#000000" font-family="Arial, sans-serif" font-size="20" font-weight="bold">JS</text>
  <!-- Google Fonts -->
  <rect x="500" y="50" width="120" height="80" rx="10" fill="#4285f4"/>
  <text x="560" y="85" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Google</text>
  <text x="560" y="105" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Fonts</text>
  <!-- Vercel Logo -->
  <rect x="50" y="160" width="120" height="80" rx="10" fill="#000000"/>
  <text x="110" y="205" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="24" font-weight="bold">Vercel</text>
  <!-- Additional elements -->
  <rect x="200" y="160" width="420" height="200" rx="20" fill="#f8f5f2"/>
  <text x="410" y="260" text-anchor="middle" fill="#2e4a7d" font-family="Arial, sans-serif" font-size="18">Tecnologías del Proyecto</text>
</svg>